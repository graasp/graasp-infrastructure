# Runs the database migrations of the admin image deployed in the target environment.
# The admin app owns the database schema: deploy the admin version that holds the migrations first.
name: Apply Migration
run-name: Apply migration on ${{ inputs.environment }}
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: environment
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-infra.yml
    with:
      state: 'db-only'
      environment: ${{ inputs.environment }}
    secrets: inherit

  wait:
    needs: deploy
    name: Wait for Migration
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Wait for Migration
        uses: ./.github/actions/wait-for-migration
        with:
          aws-role-to-assume: ${{ secrets.TF_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
