name: 'Apply Stack after PR is Merged'

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-infra.yml
    with:
      state: 'running'
      environment: 'dev'
    secrets: inherit
